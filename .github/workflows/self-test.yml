name: self-test
on: [push, workflow_dispatch]
jobs:
  assert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo '{"quote": "Overrides are applied in order of appearance", "n": 3}' > out.json
      - uses: ./
        with:
          key: ${{ secrets.S2AR_API_KEY }}
          tool: assert
          file: out.json
          checks: '[{"check":"json_valid"},{"check":"number_in_range","path":"n","min":1,"max":10}]'
